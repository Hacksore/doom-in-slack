<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';script-src 'unsafe-inline' 'wasm-unsafe-eval';style-src 'unsafe-inline';frame-src file: 'self';connect-src 'none';worker-src 'none'"
    />
    <title>Slack iframe compatibility probe</title>
    <style>
      body {
        background: #222;
        color: #eee;
        font: 14px system-ui;
      }
      iframe {
        width: 100%;
        height: 800px;
        border: 1px solid #666;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Slack iframe compatibility probe</h1>
    <p id="notice">
      If this text remains unchanged, inline JavaScript did not execute.
    </p>
    <button id="keys">Click, then press any key</button
    ><canvas id="probe" width="16" height="16"></canvas>
    <pre id="report"></pre>
    <button id="load">Load doom.html in sandbox (local testing)</button>
    <div id="host"></div>
    <script>
      const report = document.getElementById('report');
      const line = (s) => (report.textContent += s + '\n');
      document.getElementById('notice').textContent =
        'Inline JavaScript executed.';
      line('Origin: ' + self.origin);
      line('Cross-origin isolated: ' + crossOriginIsolated);
      (async () => {
        try {
          const c = document.getElementById('probe').getContext('2d');
          c.fillStyle = '#0f0';
          c.fillRect(0, 0, 16, 16);
          if (c.getImageData(0, 0, 1, 1).data[1] !== 255)
            throw Error('readback');
          line('PASS canvas 2D');
        } catch (e) {
          line('FAIL canvas: ' + e.message);
        }
        try {
          const b = Uint8Array.from(
            atob('H4sIAAAAAAACE8vPBgBH3dx5AgAAAA=='),
            (c) => c.charCodeAt(0),
          );
          const s = await new Response(
            new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip')),
          ).text();
          if (s !== 'ok') throw Error('wrong output');
          line('PASS native gzip');
        } catch (e) {
          line('FAIL native gzip: ' + e.message);
        }
        try {
          await WebAssembly.compile(Uint8Array.of(0, 97, 115, 109, 1, 0, 0, 0));
          line('PASS WebAssembly compilation');
        } catch (e) {
          line(
            'FAIL WebAssembly compilation: ' +
              e.message +
              '; wasm-unsafe-eval may be required.',
          );
        }
      })();
      document.getElementById('keys').onkeydown = (e) => {
        e.preventDefault();
        line('PASS keyboard: ' + e.code);
      };
      document.getElementById('load').onclick = () => {
        if (document.querySelector('iframe')) return;
        const f = document.createElement('iframe');
        f.title = 'DOOM opaque-origin test';
        f.setAttribute('sandbox', 'allow-scripts');
        f.src = 'doom.html';
        document.getElementById('host').append(f);
      };
    </script>
  </body>
</html>
